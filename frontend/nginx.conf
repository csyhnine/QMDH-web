limit_req_zone $binary_remote_addr zone=feedback_intake:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=feedback_sessions:10m rate=1r/s;

server {
    listen 80;
    server_name _;
    client_max_body_size 35m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api/v1/feedback/skills/sessions/?$ {
        client_max_body_size 4k;
        limit_req zone=feedback_sessions burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/feedback/skills/events/?$ {
        client_max_body_size 64k;
        limit_req zone=feedback_intake burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # studio-perf-002: serve shared media volume directly (skip backend proxy hop).
    # Requires backend_media mounted at /var/media in the frontend container.
    location /media/ {
        alias /var/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
