# Include inside the outer HTTPS server block (Baota extension directory).
# CAD fitout currently computes synchronously and can take over 60 seconds.
# No trailing slash: the list endpoint is /extracts (without a slash).
# A slash here makes nginx redirect the list before it reaches the backend.
location ^~ /api/v1/cad/extracts {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
